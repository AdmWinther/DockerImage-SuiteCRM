name: Build and Push Docker Image

on:
  push:
    branches: [ master ]   # Run the workflow when the code is pushed to the master branch
  pull_request:
    branches: [ master ]

jobs:
  #There are only one jobs: build
  # The build job builds the Docker image and pushes it to Docker Hub
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 4. Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 5. Build the Docker image
      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/suitecrm:latest .

        # 6. Push image to Docker Hub
      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/suitecrm:latest